readme = "README.md"
authors = [
    { name = "JaeWoong Eum", email = "wodnd0418@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.121.0",
    "apscheduler>=3.11.3",
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "nbformat>=5.11.0",
